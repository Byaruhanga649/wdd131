<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A product review form where users can rate products, share their experience, and provide helpful feedback about their purchases.">

    <meta name="author" content="Arthur Byaruhanga">

    <title>Product Review Form</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/form.css">

    <!-- JavaScript -->
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>


    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">

                <label for="productName">
                    Product Name <span class="required">*</span>
                </label>

                <select id="productName" name="productName" required>

                    <option value="" disabled selected>
                        Select a Product ...
                    </option>

                </select>

            </div>


            <!-- Rating -->
            <fieldset>

                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>

                <div class="rating">

                    <input type="radio" id="one" name="rating" value="1" required>
                    <label for="one">☆</label>

                    <input type="radio" id="two" name="rating" value="2" required>
                    <label for="two">☆☆</label>

                    <input type="radio" id="three" name="rating" value="3" required>
                    <label for="three">☆☆☆</label>

                    <input type="radio" id="four" name="rating" value="4" required>
                    <label for="four">☆☆☆☆</label>

                    <input type="radio" id="five" name="rating" value="5" required>
                    <label for="five">☆☆☆☆☆</label>

                </div>

            </fieldset>


            <!-- Installation Date -->
            <div class="form-group">

                <label for="installDate">
                    Date of Installation <span class="required">*</span>
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>


            <!-- Useful Features -->
            <fieldset>

                <legend>
                    Useful Features (Check all that apply)
                </legend>

                <div class="checkbox-group">

                    <div>
                        <input type="checkbox" id="durability" name="features" value="Durability">

                        <label for="durability">
                            Durability
                        </label>
                    </div>


                    <div>
                        <input type="checkbox" id="ease" name="features" value="Ease of Use">

                        <label for="ease">
                            Ease of Use
                        </label>
                    </div>


                    <div>
                        <input type="checkbox" id="performance" name="features" value="Performance">

                        <label for="performance">
                            Performance
                        </label>
                    </div>


                    <div>
                        <input type="checkbox" id="design" name="features" value="Design">

                        <label for="design">
                            Design
                        </label>
                    </div>

                </div>

            </fieldset>


            <!-- Written Review -->
            <div class="form-group">

                <label for="writtenReview">
                    Written Review (Optional)
                </label>

                <textarea id="writtenReview" name="writtenReview" rows="6"
                    placeholder="Write your review here..."></textarea>

            </div>


            <!-- User Name -->
            <div class="form-group">

                <label for="userName">
                    Your Name (Optional)
                </label>

                <input type="text" id="userName" name="userName" placeholder="Enter your name">

            </div>


            <!-- Submit -->
            <div class="form-group">

                <input type="submit" value="Submit Product Review">

            </div>


        </form>

    </main>


    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            Arthur Byaruhanga | Uganda
        </p>

        <p id="lastModified"></p>

    </footer>


</body>

</html>
